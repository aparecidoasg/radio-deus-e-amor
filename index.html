<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Rádio Gospel Deus é Amor - ouça ao vivo no seu celular">
  <meta name="apple-mobile-web-app-title" content="Deus é Amor">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <title>Rádio Deus é Amor</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">&#9990;</span>
        <div class="logo-text">
          <h1>Deus é Amor</h1>
          <p>Rádio Gospel Online</p>
        </div>
      </div>
      <div class="now-playing">
        <div class="equalizer" id="equalizer">
          <span></span><span></span><span></span><span></span>
        </div>
        <span id="stationName">Selecione uma rádio</span>
      </div>
    </header>

    <main class="main">
      <section class="player-card">
        <div class="disc" id="disc">
          <div class="disc-inner">
            <span class="disc-icon">&#9990;</span>
          </div>
        </div>

        <div class="controls">
          <button class="btn-play" id="btnPlay" title="Tocar / Pausar">
            <svg id="iconPlay" viewBox="0 0 24 24" width="28" height="28">
              <polygon points="6,3 20,12 6,21" fill="currentColor"/>
            </svg>
            <svg id="iconPause" viewBox="0 0 24 24" width="28" height="28" style="display:none">
              <rect x="5" y="4" width="5" height="16" rx="1" fill="currentColor"/>
              <rect x="14" y="4" width="5" height="16" rx="1" fill="currentColor"/>
            </svg>
          </button>

          <div class="volume">
            <span class="volume-icon" id="volumeIcon">&#128266;</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="80">
          </div>
        </div>
      </section>

      <section class="stations">
        <h2>Estações</h2>
        <ul id="stationList"></ul>
      </section>

      <section class="custom">
        <h2>Ouça outra rádio</h2>
        <div class="custom-row">
          <input type="url" id="customUrl" placeholder="Cole aqui o link da rádio (http://... ou https://...)" inputmode="url">
          <button class="btn-add" id="btnCustom" title="Tocar">&#9654;</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Feito com &#10084; — "Deus é amor" (1 João 4:8)</p>
    </footer>
  </div>

  <script src="js/stations.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
